<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElmecV2 - Visualizador de Flujos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.4);
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            /* Lighter for better readability */
            --border: rgba(255, 255, 255, 0.1);
            --radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background-color: #0b1121;
            /* Darker sidebar */
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 32px 24px;
            z-index: 20;
            box-shadow: 5px 0 30px rgba(0, 0, 0, 0.3);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), #2563eb);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .brand-text h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: white;
        }

        .brand-text p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .menu-label {
            font-size: 12px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: 0.1em;
        }

        .flow-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .flow-item {
            padding: 16px;
            border-radius: 16px;
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .flow-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .flow-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .flow-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .flow-item.active .flow-icon {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .flow-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            color: white;
        }

        .flow-info p {
            font-size: 13px;
            color: #94a3b8;
        }

        /* Main Content */
        .main-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
        }

        /* Grid Background Pattern */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-size: 50px 50px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            pointer-events: none;
        }

        .top-bar {
            padding: 32px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .current-flow-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 16px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: white;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* Visualization Area - Carousel */
        .viz-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            /* No overflow scrolling, we control transform */
            overflow: hidden;
        }

        .flow-steps {
            display: flex;
            align-items: center;
            gap: 0;
            /* Gap handled by margin in cards for precise math */
            position: absolute;
            left: 50%;
            /* Start from center */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            padding-left: 0;
        }

        .step-card {
            width: 320px;
            height: 420px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0.3;
            transform: scale(0.85);
            margin: 0 40px;
            /* Spacing between cards */
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .step-card:hover {
            opacity: 0.6;
            transform: scale(0.9);
            background: rgba(30, 41, 59, 0.6);
        }

        .step-card.active {
            opacity: 1;
            transform: scale(1.1);
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(59, 130, 246, 0.15);
            z-index: 10;
        }

        .step-card.completed {
            opacity: 0.5;
            transform: scale(0.9);
            background: rgba(16, 185, 129, 0.05);
            border-color: rgba(16, 185, 129, 0.3);
        }

        /* Connector Line Logic */
        .connector {
            position: absolute;
            top: 50%;
            right: -80px;
            /* Double margin size */
            width: 80px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 0;
            transition: all 0.5s;
        }

        .step-card.active .connector {
            background: linear-gradient(90deg, var(--primary), rgba(255, 255, 255, 0.1));
        }

        .step-card.completed .connector {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green-glow);
        }

        /* Card Content */
        .step-number {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #94a3b8;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 16px;
        }

        .step-card.active .step-number {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px var(--primary-glow);
            border-color: transparent;
        }

        .step-card.completed .step-number {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-color: #34d399;
        }

        .step-icon-large {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: auto;
            /* Pushes content down */
            color: white;
            transition: all 0.5s;
        }

        .step-card.active .step-icon-large {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(37, 99, 235, 0.1));
            color: #60a5fa;
            transform: translateY(-5px);
        }

        .step-content {
            margin-top: 20px;
        }

        .step-actor {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--primary);
            margin-bottom: 8px;
            font-weight: 800;
        }

        .step-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
            color: white;
        }

        .step-desc {
            font-size: 15px;
            color: #cbd5e1;
            line-height: 1.6;
            font-weight: 400;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 24px;
            gap: 6px;
            width: fit-content;
        }

        .badge-system {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-manual {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        /* Progress Bar at Bottom */
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            transition: width 0.5s ease;
            width: 0%;
        }

        /* Metrics Float */
        .metrics-float {
            position: absolute;
            bottom: 48px;
            right: 48px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            padding: 24px 32px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 50;
        }

        .metric {
            display: flex;
            flex-direction: column;
        }

        .metric-val {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .metric-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <i data-lucide="zap" color="white" size="28"></i>
            </div>
            <div class="brand-text">
                <h1>ElmecV2</h1>
                <p>Flow Inspector</p>
            </div>
        </div>

        <div class="menu-label">Casos de Uso</div>
        <div class="flow-list" id="flowList">
            <!-- Populated by JS -->
        </div>

        <div style="margin-top: auto; opacity: 0.4; font-size: 11px; text-align: center;">
            v2.1.0 • Demo Build
        </div>
    </div>

    <!-- Main Stage -->
    <div class="main-stage">
        <div class="grid-bg"></div>

        <div class="top-bar">
            <div>
                <div class="menu-label" style="margin-bottom: 4px;">VISUALIZANDO FLUJO</div>
                <div class="current-flow-title" id="flowTitle">Selecciona un flujo</div>
            </div>
            <div class="controls">
                <button class="btn btn-secondary" onclick="resetFlow()">
                    <i data-lucide="rotate-ccw" size="18"></i> Reiniciar
                </button>
                <button class="btn btn-primary" onclick="nextStep()">
                    <span id="btnText">Iniciar Recorrido</span>
                    <i data-lucide="arrow-right" size="18"></i>
                </button>
            </div>
        </div>

        <div class="viz-container">
            <div class="flow-steps" id="stepsContainer">
                <!-- Steps will be injected here -->
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="metrics-float">
            <div class="metric">
                <span class="metric-val" id="currentStepDisplay">0/0</span>
                <span class="metric-label">Progreso</span>
            </div>
            <div class="metric">
                <span class="metric-val" id="statusDisplay">Inactivo</span>
                <span class="metric-label">Estado</span>
            </div>
        </div>
    </div>

    <script>
        // Data Structure matching the app
        const flows = [
            {
                id: 'emergency',
                title: 'Reparación de Emergencia',
                description: 'Flujo crítico de reporte y atención inmediata',
                icon: 'siren',
                steps: [
                    {
                        actor: 'Cliente',
                        title: 'Inicio de Sesión',
                        desc: 'El usuario accede con credenciales de cliente industrial seguro.',
                        icon: 'log-in',
                        type: 'manual'
                    },
                    {
                        actor: 'Cliente',
                        title: 'Crear Solicitud',
                        desc: 'Reporta "Error E404 en CNC" y marca prioridad "Urgente".',
                        icon: 'file-warning',
                        type: 'manual'
                    },
                    {
                        actor: 'Sistema',
                        title: 'Validación & IA',
                        desc: 'Valida datos, crea ticket y asigna agente por zona automáticamente.',
                        icon: 'cpu',
                        type: 'system'
                    },
                    {
                        actor: 'Sistema',
                        title: 'Sala de Chat',
                        desc: 'Genera sala de chat dedicada y envía PUSH al agente.',
                        icon: 'message-square-plus',
                        type: 'system'
                    },
                    {
                        actor: 'Cliente',
                        title: 'Confirmación',
                        desc: 'El cliente es redirigido al detalle de su solicitud creada.',
                        icon: 'check-circle',
                        type: 'auto'
                    }
                ]
            },
            {
                id: 'agent-response',
                title: 'Respuesta del Agente',
                description: 'Ciclo de vida de atención y resolución',
                icon: 'headset',
                steps: [
                    {
                        actor: 'Agente',
                        title: 'Notificación',
                        desc: 'Recibe alerta "Nueva solicitud asignada" en su dispositivo.',
                        icon: 'bell',
                        type: 'system'
                    },
                    {
                        actor: 'Agente',
                        title: 'Diagnóstico',
                        desc: 'Revisa ticket. Estado "Nuevo" (Amarillo). Ve fotos adjuntas.',
                        icon: 'search',
                        type: 'manual'
                    },
                    {
                        actor: 'Agente',
                        title: 'Chat en Vivo',
                        desc: 'Solicita más info: "Envíame foto del manómetro".',
                        icon: 'message-circle',
                        type: 'manual'
                    },
                    {
                        actor: 'Agente',
                        title: 'En Proceso',
                        desc: 'Cambia estado a "En Proceso" (Verde). Cliente ve el cambio.',
                        icon: 'refresh-cw',
                        type: 'manual'
                    },
                    {
                        actor: 'Agente',
                        title: 'Cierre',
                        desc: 'Marca como "Resuelto" (Azul) al confirmar reparación.',
                        icon: 'check-check',
                        type: 'manual'
                    }
                ]
            },
            {
                id: 'admin-supervision',
                title: 'Supervisión Admin',
                description: 'Monitoreo de KPIs y gestión de equipo',
                icon: 'shield-check',
                steps: [
                    {
                        actor: 'Admin',
                        title: 'Dashboard Global',
                        desc: 'Visualiza KPIs: Tickets sin atender vs. Resueltos.',
                        icon: 'layout-dashboard',
                        type: 'manual'
                    },
                    {
                        actor: 'Admin',
                        title: 'Alerta Roja',
                        desc: 'Filtra por estado "Sin Atender" (Rojo) > 3 días.',
                        icon: 'alert-octagon',
                        type: 'manual'
                    },
                    {
                        actor: 'Admin',
                        title: 'Auditoría',
                        desc: 'Revisa historial de chat para detectar cuellos de botella.',
                        icon: 'file-search',
                        type: 'manual'
                    },
                    {
                        actor: 'Admin',
                        title: 'Reasignación',
                        desc: 'Asigna manualmente a un Técnico Senior para resolver.',
                        icon: 'user-cog',
                        type: 'manual'
                    }
                ]
            }
        ];

        // State
        let currentFlowIndex = 0;
        let currentStepIndex = -1;

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            loadFlow(0);
        });

        function renderSidebar() {
            const list = document.getElementById('flowList');
            list.innerHTML = '';
            flows.forEach((flow, index) => {
                const item = document.createElement('div');
                item.className = `flow-item ${index === currentFlowIndex ? 'active' : ''}`;
                item.onclick = () => loadFlow(index);
                item.innerHTML = `
                    <div class="flow-icon">
                        <i data-lucide="${flow.icon}" size="20"></i>
                    </div>
                    <div class="flow-info">
                        <h3>${flow.title}</h3>
                        <p>${flow.description.substring(0, 25)}...</p>
                    </div>
                `;
                list.appendChild(item);
            });
            lucide.createIcons();
        }

        function loadFlow(index) {
            currentFlowIndex = index;
            currentStepIndex = -1; // Reset
            renderSidebar();

            const flow = flows[index];
            document.getElementById('flowTitle').innerText = flow.title;
            document.getElementById('btnText').innerText = "Iniciar Recorrido";

            // Render Steps
            const container = document.getElementById('stepsContainer');
            container.innerHTML = '';

            flow.steps.forEach((step, i) => {
                const card = document.createElement('div');
                card.className = 'step-card';
                card.id = `step-${i}`;
                card.onclick = () => setStep(i);

                // Connector (line to next step)
                const connector = i < flow.steps.length - 1 ? `<div class="connector"></div>` : '';

                card.innerHTML = `
                    <div class="step-number">${i + 1}</div>
                    <div class="step-icon-large">
                        <i data-lucide="${step.icon}" size="32"></i>
                    </div>
                    <div class="step-content">
                        <div class="step-actor">${step.actor}</div>
                        <div class="step-title">${step.title}</div>
                        <div class="step-desc">${step.desc}</div>
                    </div>
                    <div class="badge badge-${step.type === 'system' ? 'system' : 'manual'}">
                        <i data-lucide="${step.type === 'system' ? 'zap' : 'mouse-pointer-2'}" size="12"></i>
                        ${step.type === 'system' ? 'Automático' : 'Manual'}
                    </div>
                    ${connector}
                `;
                container.appendChild(card);
            });

            lucide.createIcons();

            // Center the container initially
            centerCarousel(-1);
            updateMetrics();
        }

        function nextStep() {
            const flow = flows[currentFlowIndex];
            if (currentStepIndex < flow.steps.length - 1) {
                setStep(currentStepIndex + 1);
            }
        }

        function setStep(index) {
            currentStepIndex = index;
            const flow = flows[currentFlowIndex];

            // Update UI classes
            for (let i = 0; i < flow.steps.length; i++) {
                const el = document.getElementById(`step-${i}`);
                el.className = 'step-card'; // Reset
                if (i < index) el.classList.add('completed');
                if (i === index) el.classList.add('active');
            }

            centerCarousel(index);
            updateMetrics();

            document.getElementById('btnText').innerText =
                index >= flow.steps.length - 1 ? "Completado" : "Siguiente Paso";
        }

        function centerCarousel(activeIdx) {
            const container = document.getElementById('stepsContainer');
            // Card width (320) + Margin (40+40=80) = 400px per item
            const itemWidth = 400;

            // We want to center the specific index relative to the center of the screen
            // Since .flow-steps is position:absolute left:50%, translation of 0 means the START of the list is at center
            // We need to shift it left to center the specific item.
            // Formula: -(index * itemWidth) - (itemWidth / 2 representing the half of the current card)

            let offset = 0;

            if (activeIdx === -1) {
                // Initial state: Show first card slightly to the right of center or just center first card but dim
                offset = -(0 * itemWidth) - (320 / 2) + 200; // Shift slightly right
            } else {
                offset = -(activeIdx * itemWidth) - (320 / 2); // Shift left by N items, then center the card itself
            }

            container.style.transform = `translateX(${offset}px)`;
        }

        function resetFlow() {
            currentStepIndex = -1;
            setStep(-1);
            centerCarousel(-1);
        }

        function updateMetrics() {
            const flow = flows[currentFlowIndex];

            // Step display
            const displayIdx = currentStepIndex === -1 ? 0 : currentStepIndex + 1;
            document.getElementById('currentStepDisplay').innerText = `${displayIdx}/${flow.steps.length}`;

            // Status
            const statusEl = document.getElementById('statusDisplay');
            if (currentStepIndex === -1) {
                statusEl.innerText = "Listo";
                statusEl.style.color = "#94a3b8";
            } else if (currentStepIndex < flow.steps.length - 1) {
                statusEl.innerText = "En Progreso";
                statusEl.style.color = "#f59e0b";
            } else {
                statusEl.innerText = "Completado";
                statusEl.style.color = "#10b981";
            }

            // Progress Bar
            let pct = 0;
            if (currentStepIndex >= 0) {
                pct = Math.round(((currentStepIndex + 1) / flow.steps.length) * 100);
            }
            document.getElementById('progressBar').style.width = `${pct}%`;
        }
    </script>
</body>

</html>
